 // Simulate: each line is a vector clock state
 const clocks = events;
 const relations = [];
 for(let i=0;i<clocks.length;i++){
  for(let j=i+1;j<clocks.length;j++){
   const a = clocks[i], b = clocks[j];
   const le = a.every((x,k)=>x<=b[k]);
   const ge = a.every((x,k)=>x>=b[k]);
   let rel;
   if(a.every((x,k)=>x===b[k])) rel = 'equal';
   else if(le) rel = 'a < b';
   else if(ge) rel = 'a > b';
   else rel = 'concurrent';
   relations.push(`  V${i} vs V${j}: ${rel}`);
  }
 }
 const rows = clocks.map((v, i)=>`  V${i}: [${v.join(', ')}]`);
 return{
  encoded:`Replicas: ${n}\nClocks:\n${rows.join('\n')}\n\nPairwise relations:\n${relations.join('\n')}`,
  decoded:`Vector clocks track causality. V(a) < V(b) means a happened before b. Neither less nor greater means concurrent.`
 };

 const levels2 = merkleTree(changedLeaves);
 const diff = merkleDiff(levels, levels2, levels.length-1);
 // Display levels
 const show = levels.map((lvl, i)=>`  level ${i}: [${lvl.map(n=>n.hash.toString(16).slice(0,6)).join(', ')}]`);
 return{
  encoded:`Leaves: ${nLeaves}\nChanged leaf index: ${changeIdx}\n\nMerkle levels (first 6 chars of hash):\n${show.join('\n')}\n\nRoot changed: ${levels[levels.length-1][0].hash !== levels2[levels2.length-1][0].hash}\n\nChanged leaves (via descent):\n${(diff.changes||[]).map(c=>`  ${c.a} -> ${c.b}`).join('\n') || '  (none)'}`,
  decoded:`A Merkle tree hashes leaves and internal nodes. Comparing roots detects any change. Descent visits only the differing subtree.`
 };
}
function demoGitObj(text){
 const lines = text.trim().split(/\n/);
 const content = lines[0]||'hello world';
 const type = (lines[1]||'blob').trim();
 // Simulate Git object hashing with a simple SHA-1-like (we can't use real SHA-1 in browser easily)
 // Actually we can use SubtleCrypto but it's async. Use a simplified hash for display.
 const header = `${type} ${content.length}\0`;
 const store = header + content;
 let h = 0x67452301;
 for(let i=0;i<store.length;i++) h = ((h * 31) + store.charCodeAt(i)) >>> 0;
 const hex = h.toString(16).padStart(8, '0');
 // Also compute djb2
 const djb = djb2(store).toString(16).padStart(8, '0');
 return{
  encoded:`Type: ${type}\nContent: "${content}"\nContent length: ${content.length}\n\nHeader: "${header.replace(/\0/g, '\\0')}"\nSerialisation: header + content\n\nSimulated hash (not SHA-1, for teaching): ${hex}\nDJB2 (short fingerprint): ${djb}\n\nReal Git uses SHA-1:\n  sha1(header + content)\n  e.g., "hello world\\n" -> 3b18e512dba79e4c8300dd08aeb37f8e728b8dad\n\nThe full object ID is content-addressed.\nSame content -> same ID -> deduplication.`,
  decoded:`Every Git object is serialised as '<type> <size>\\0<payload>' and hashed. The hash is the object ID. Content addressing gives automatic deduplication.`
 };
}
function demoPackfile(text){
 const [nObj, nPacked, avgChain] = parseNums(text);
 const loose = nObj||100;
 const packed = nPacked||20;
 const chain = avgChain||3;
 const avgLooseSize = 500;
 const avgPackedSize = 100;
 const totalLoose = loose * avgLooseSize;
 const totalPacked = packed * avgPackedSize;
 return{
  encoded:`Loose objects: ${loose}\nPacked objects: ${packed}\nAverage delta chain depth: ${chain}\n\nEstimated sizes:\n  Loose: ${totalLoose} bytes (${loose} objects * ${avgLooseSize} B avg)\n  Packed: ${totalPacked} bytes (${packed} objects * ${avgPackedSize} B avg)\n  Savings: ${((1 - totalPacked/totalLoose)*100).toFixed(0)}%\n\nRead cost per object:\n  loose: O(1)\n  packed: O(chain depth) = O(${chain})`,
  decoded:`Packfiles group many objects and delta-compress similar ones. Depth is bounded (~50) to keep read times reasonable. Git repacks periodically.`
 };
}
function demoCdc(text){
 const [size, minSize, avgBits] = parseNums(text);
 const n = Math.min(4096, size||256);
 const minS = minSize||16;
 const bits = avgBits||1024;
 let data = '';
 let s = 42;
 for(let i=0;i<n;i++){ s = (s * 1103515245 + 12345) >>> 0; data += String.fromCharCode(97 + (s % 26)); }
 // CDC with a simple rolling hash
 const mask = (1 << Math.round(Math.log2(bits))) - 1;
 const chunks = [];
 let start = 0, h = 0;
 for(let i=0;i<data.length;i++){
  h = ((h << 1) ^ data.charCodeAt(i)) >>> 0;
  if(i - start >= minS && (h & mask) === 0){
   chunks.push({start, end:i+1, len: i+1-start});
   start = i+1;
   h = 0;
  }
 }
 if(start < data.length) chunks.push({start, end:data.length, len:data.length-start});
 const sizes = chunks.map(c=>c.len);
 const mean = sizes.reduce((a,b)=>a+b, 0) / sizes.length;
 const variance = sizes.reduce((s,x)=>s+(x-mean)**2, 0) / sizes.length;
 return{
  encoded:`Data: ${n} bytes\nMin chunk: ${minS}\nTarget avg: ${1<<Math.round(Math.log2(bits))}\n\nChunks: ${chunks.length}\nMean size: ${mean.toFixed(1)}\nStd dev: ${Math.sqrt(variance).toFixed(1)}\n\nFirst 12 chunks:\n${chunks.slice(0,12).map((c,i)=>`  chunk ${i}: [${c.start}, ${c.end}) len=${c.len}`).join('\n')}`,
  decoded:`Content-defined chunking cuts where a rolling hash matches a pattern. Boundaries depend on content, not position, so insertions shift only nearby chunks.`
 };
}
function demoFastCdc(text){
 const [size, minSize, normalSize] = parseNums(text);
 const n = Math.min(4096, size||256);
 const minS = minSize||16;
 const normalS = normalSize||64;
 const data = Array.from({length:n}, (_, i)=>String.fromCharCode(97 + (i % 26))).join('');
 const maxS = normalS * 4;
 const chunks = fastCDCChunks(data, minS, normalS, maxS);
 const sizes = chunks.map(c=>c.len);
 const mean = sizes.reduce((a,b)=>a+b, 0) / sizes.length;
 const variance = sizes.reduce((s,x)=>s+(x-mean)**2, 0) / sizes.length;
 return{
  encoded:`Data: ${n} bytes\nMin: ${minS}\nNormal: ${normalS}\nMax: ${maxS}\n\nChunks: ${chunks.length}\nMean size: ${mean.toFixed(1)}\nStd dev: ${Math.sqrt(variance).toFixed(1)}\n\nFirst 12 chunks:\n${chunks.slice(0,12).map((c,i)=>`  chunk ${i}: [${c.start}, ${c.end}) len=${c.len}`).join('\n')}`,
  decoded:`FastCDC uses a gear hash (one shift and add per byte) with normalized chunking. Cuts are less likely before the normal size, tightening the distribution.`
 };
}

function runLab(l,initial){
 const input=$('#labInput').value;
 let res;
 try{
  if(!initial){$('#labEncoded').textContent='Running…';$('#labDecoded').textContent=''}
  switch(l.demo){
   case'lcs':res=demoLcs(input);break;
   case'edit-script':res=demoEditScript(input);break;
   case'edit-costs':res=demoEditCosts(input);break;
   case'myers':res=demoMyers(input);break;
   case'hunt':res=demoHunt(input);break;
   case'patience':res=demoPatience(input);break;
   case'histogram':res=demoHistogram(input);break;
   case'three-way':res=demoThreeWay(input);break;
   case'json-merge':res=demoJsonMerge(input);break;
   case'ot':res=demoOt(input);break;
   case'crdt':res=demoCrdt(input);break;
   case'vclock':res=demoVclock(input);break;
   case'rsync':res=demoRsync(input);break;
   case'merkle':res=demoMerkle(input);break;
   case'git-obj':res=demoGitObj(input);break;
   case'packfile':res=demoPackfile(input);break;
   case'cdc':res=demoCdc(input);break;
   case'fastcdc':res=demoFastCdc(input);break;
   default:throw Error('No interactive implementation is available for this lesson.');
  }
 }catch(e){
  res={encoded:'Input or runtime error',decoded:e.message};
 }
 const el=$('#labEncoded');
 if(res.html){el.innerHTML=res.html+'\n\n'+res.encoded}else{el.textContent=res.encoded}
 $('#labDecoded').textContent=res.decoded;
 if(!initial)toast('Lab complete');
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-vcs-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
